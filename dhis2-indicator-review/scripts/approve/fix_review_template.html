<title>Fix Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Fix approval page (any metadata type: labels, fields and export formats come from DATA). DATA is fix-review.json (build_fix_review.py); MODE is artifact or standalone (make_standalone.py).
   Layout: sticky header with progress + export; left rail of fix groups; main column of side-by-side before/after cards */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #14201d; --muted: #5b6a66; --line: #d6dedb; --soft: #e8eeec;
  --accent: #0d6e66; --accent-ink: #ffffff; --accent-soft: #d5ece9;
  --ok: #2c7a3f; --ok-soft: #dcefe1; --no: #b3261e; --no-soft: #f7dedb; --warn: #9a5b00; --warn-soft: #f8e7d2; --new: #6b3fa0; --new-soft: #ece2f5;
  --add-bg: #d4f0dc; --add-ink: #145c2a; --del-bg: #f8d9d6; --del-ink: #8f1d16;
  --code-bg: #f6f8f7;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1614; --panel: #17201e; --ink: #e6eeeb; --muted: #9aaba6; --line: #2c3a37; --soft: #1f2a28;
  --accent: #4fc2b5; --accent-ink: #0b1311; --accent-soft: #163b37;
  --ok: #7bd492; --ok-soft: #183222; --no: #ff8a80; --no-soft: #3a1c1a; --warn: #ffb35c; --warn-soft: #3a2a14; --new: #d0a2f2; --new-soft: #2f2139;
  --add-bg: #173a22; --add-ink: #a6e7b8; --del-bg: #43201d; --del-ink: #ffb3ab; --code-bg: #121a18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1614; --panel: #17201e; --ink: #e6eeeb; --muted: #9aaba6; --line: #2c3a37; --soft: #1f2a28;
  --accent: #4fc2b5; --accent-ink: #0b1311; --accent-soft: #163b37;
  --ok: #7bd492; --ok-soft: #183222; --no: #ff8a80; --no-soft: #3a1c1a; --warn: #ffb35c; --warn-soft: #3a2a14; --new: #d0a2f2; --new-soft: #2f2139;
  --add-bg: #173a22; --add-ink: #a6e7b8; --del-bg: #43201d; --del-ink: #ffb3ab; --code-bg: #121a18; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui); }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
code, .code { font-family: var(--font-code); font-size: 12.5px }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center }
header.top h1 { font-size: 18px; margin: 0; letter-spacing: .01em }
.prog { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; display: flex }
.bar i { display: block; height: 100% } .bar .a { background: var(--ok) } .bar .r { background: var(--no) }
.prog small { color: var(--muted); font-variant-numeric: tabular-nums }
.state { font-size: 12px; color: var(--muted) }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; font-size: 14px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.okb { border-color: var(--ok); color: var(--ok) } .btn.nob { border-color: var(--no); color: var(--no) }
.btn.okb.on { background: var(--ok); color: var(--panel) } .btn.nob.on { background: var(--no); color: var(--panel) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.wrap { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px) }
nav.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 12px 10px; position: sticky; top: var(--hdr, 100px); align-self: start; max-height: calc(100vh - var(--hdr, 100px)); overflow: auto }
nav.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 8px 6px }
nav.rail button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 7px 8px }
nav.rail button:hover { background: var(--soft) } nav.rail button.cur { background: var(--accent-soft) }
nav.rail .t { font-size: 13.5px; line-height: 1.3 } nav.rail .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: start }
nav.rail .mini { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--soft); display: flex; overflow: hidden }
nav.rail .mini i { display: block; height: 100% } nav.rail .mini .a { background: var(--ok) } nav.rail .mini .r { background: var(--no) }
main { padding: 20px 24px 60px; min-width: 0 }
.ghead { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; margin-bottom: 14px }
.ghead h2 { margin: 0; font-size: 21px; text-wrap: balance }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; vertical-align: middle }
.badge.new { color: var(--new); background: var(--new-soft) } .badge.warn { color: var(--warn); background: var(--warn-soft) }
.badge.ok { color: var(--ok); background: var(--ok-soft) } .badge.no { color: var(--no); background: var(--no-soft) } .badge.mut { color: var(--muted) }
.change { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px }
.tools select, .tools input[type=search] { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink) }
.tools label { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px; align-items: center }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden }
.card.approved { border-left: 4px solid var(--ok) } .card.rejected { border-left: 4px solid var(--no) }
.chead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; padding: 10px 14px; align-items: start }
.chead .code { font-weight: 700; font-family: var(--font-code); font-size: 13.5px }
.chead .nm { color: var(--muted); font-size: 13.5px }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px }
.chip { font-size: 11.5px; border-radius: 10px; padding: 1px 8px; background: var(--soft); color: var(--muted); border: 1px solid transparent }
.chip.here { border-color: var(--accent); color: var(--ink) } .chip.s-approved { background: var(--ok-soft); color: var(--ok) } .chip.s-rejected { background: var(--no-soft); color: var(--no) }
.flags { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 13px }
.flag { padding: 4px 8px; border-radius: 6px }
.flag.warn { background: var(--warn-soft); color: var(--warn) } .flag.no { background: var(--no-soft); color: var(--no) } .flag.info { background: var(--soft); color: var(--muted) }
.acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end }
.toggle { border: 0; background: none; color: var(--accent); font-size: 13.5px; padding: 2px 0 }
.cbody { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 12px }
.field h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.sbs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px }
.side { min-width: 0 }
.side .lbl { font-size: 12px; color: var(--muted); margin-bottom: 3px }
.side .code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.55 }
.del { background: var(--del-bg); color: var(--del-ink); text-decoration: line-through; border-radius: 3px }
.add { background: var(--add-bg); color: var(--add-ink); border-radius: 3px }
.same { color: var(--muted) }
ul.notes { margin: 0; padding-left: 18px; font-size: 13.5px }
textarea { width: 100%; min-height: 84px; font: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); resize: vertical }
.desc-cur { font-size: 14px; color: var(--muted); font-style: italic }
.tst { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
table.t th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted) }
.tw { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px }
.panel h2 { margin: 0 0 8px; font-size: 18px } .panel h3 { margin: 14px 0 6px; font-size: 15px }
.panel p { margin: 6px 0; max-width: 80ch }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 8px 0 }
.stats div { display: flex; flex-direction: column } .stats b { font-size: 22px; font-variant-numeric: tabular-nums } .stats span { font-size: 12.5px; color: var(--muted) }
.shots { display: grid; gap: 14px } .shots figure { margin: 0 } .shots img { border: 1px solid var(--line); border-radius: 6px; display: block; max-width: 100%; height: auto }
.shots figcaption { font-size: 13px; color: var(--muted); margin-top: 4px }
.pass { color: var(--ok); font-weight: 700 } .fail { color: var(--no); font-weight: 700 }
.export-out { display: grid; gap: 8px } .export-out textarea { font-family: var(--font-code); font-size: 12px; min-height: 160px }
.muted { color: var(--muted) }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr) } nav.rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line) } .sbs { grid-template-columns: 1fr } main { padding: 14px 16px 40px } header.top { padding: 10px 16px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
.top2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100% }
.top2 input[type=text] { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 15em; max-width: 100% }
.filebtn { position: relative; overflow: hidden } .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer }
.sep { width: 1px; align-self: stretch; background: var(--line) }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 9; max-width: calc(100vw - 32px) }
header.top h1 .sub { font-weight: 400; color: var(--muted); font-size: 15px; margin-left: 6px }
[hidden] { display: none !important }
body { margin: 0 }
</style>

<header class="top" id="top">
  <h1><span id="ptype">Fix Approvals</span> <span class="sub" id="ptitle"></span></h1>
  <div class="prog"><div class="bar" id="bar"></div><small id="progtxt">Loading…</small></div>
  <span class="state" id="dbstate"></span>
  <div class="top2">
    <span class="row" id="saCtl" hidden>
      <label for="reviewer" class="state">Your name</label><input type="text" id="reviewer" placeholder="Shown on your decisions" autocomplete="name">
      <button class="btn" id="saveDec" type="button">Save decisions file</button>
      <span class="btn filebtn">Load decisions files<input type="file" id="loadDec" accept=".json,application/json" multiple aria-label="Load decisions files"></span>
      <span class="sep"></span>
    </span>
    <button class="btn primary" id="expItems" type="button">Approved items</button>
    <button class="btn" id="expFail" type="button">Approved, still failing</button>
    <button class="btn" id="expAux" type="button">Related objects</button>
    <button class="btn" id="expCsv" type="button">Summary (.csv)</button>
  </div>
</header>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Fix groups"></nav>
  <main id="main"></main>
</div>
<script>
const DATA = __DATA__;
const MODE = '__MODE__';            // 'artifact': shared store (claude.use db/user/downloads); 'standalone': browser storage + decisions files
const SA = MODE === 'standalone';
const FORMAT = 'pireview-fix-decisions/1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const G = DATA.groups, GK = Object.fromEntries(G.map(g => [g.key, g]));
const LB = DATA.labels || {};
const IK = (DATA.kinds || {}).item, AK = (DATA.kinds || {}).aux;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const IT = Object.fromEntries(DATA.items.map(p => [p.id, p]));
const AX = Object.fromEntries(DATA.aux.map(m => [m.id, m]));
const AUXX = DATA.auxExport || null;
const N = DATA.names;
const T = DATA.test || {};
let approvals = {};      // groupKey -> {states: {itemId: 'approved'|'rejected'}, meta: {itemId: {by, at}}, by, at}
let descEdits = {};      // itemId -> {text, by, at}
let conflicts = [];      // standalone: [{g, id, a: {by, state, at}, b: {...}}]
let db = null, me = '', canWrite = true, storeState = SA ? 'browser' : 'connecting';
let view = 'overview', filt = 'all', q = '', readable = false, open = new Set();
try { readable = localStorage.getItem('fix-readable') === '1'; view = localStorage.getItem('fix-view') || 'overview'; } catch (e) {}
if (!(view === 'overview' || view === 'excluded' || GK[view])) view = 'overview';
document.title = `${LB.short || ''} Fix Approvals: ` + DATA.title;
$('#ptype').textContent = `${LB.short || ''} Fix Approvals`;
$('#ptitle').textContent = DATA.title;
$('#saCtl').hidden = !SA;
new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px')).observe($('#top'));

const st = (g, id) => approvals[g]?.states?.[id] || 'pending';
function itemStatus(item) { const s = item.groups.map(g => st(g, item.id)); if (s.includes('rejected')) return 'rejected'; if (s.every(x => x === 'approved')) return 'approved'; return 'pending'; }
function groupCounts(g) { const c = { approved: 0, rejected: 0, pending: 0 }; g.items.forEach(id => c[st(g.key, id)]++); return c; }
const label = g => GK[g]?.short || g;
const piName = p => (p.code && p.name.startsWith(p.code)) ? p.name.slice(p.code.length).replace(/^[\s.:-]+/, '') : p.name;

// ---------- expression display ----------
const TOK = /#\{[^}]+\}|A\{[^}]+\}|V\{[^}]+\}|'(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|d2:\w+|containsItems|contains|-?\d+(?:\.\d+)?|&&|\|\||==|!=|<=|>=|[<>()!,+\-*/]|[A-Za-z_]\w*|\S/g;
const toks = s => (s || '').match(TOK) || [];
function nameTok(t) {
  if (!readable) return t;
  let m = t.match(/^#\{(\w+)\.(\w+)\}$/); if (m) return `#{${N[m[1]] || m[1]} · ${N[m[2]] || m[2]}}`;
  m = t.match(/^A\{(\w+)\}$/); if (m) return `A{${N[m[1]] || m[1]}}`;
  return t;
}
function joinToks(list) {
  let out = '';
  list.forEach((x, i) => {
    const t = x.t, prev = i ? list[i - 1].t : '';
    const sp = i && !(prev === '(' || prev === '!' || t === ')' || t === ',' || /\($/.test(prev) || (t === '(' && /^(d2:\w+|contains|containsItems)$/.test(prev)));
    out += (sp ? ' ' : '') + (x.k ? `<span class="${x.k}">${esc(nameTok(t))}</span>` : esc(nameTok(t)));
  });
  return out;
}
function diff(a, b) {
  const A = toks(a), B = toks(b), n = A.length, m = B.length;
  if (n * m > 400000) return [A.map(t => ({ t, k: 'del' })), B.map(t => ({ t, k: 'add' }))];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const left = [], right = []; let i = 0, j = 0;
  while (i < n && j < m) { if (A[i] === B[j]) { left.push({ t: A[i] }); right.push({ t: B[j] }); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) left.push({ t: A[i++], k: 'del' }); else right.push({ t: B[j++], k: 'add' }); }
  while (i < n) left.push({ t: A[i++], k: 'del' }); while (j < m) right.push({ t: B[j++], k: 'add' });
  return [left, right];
}
function sbs(title, a, b) {
  if ((a || '') === (b || '')) return '';
  const [l, r] = diff(a, b);
  const L = joinToks(l) || '<span class="same">(empty)</span>', R = joinToks(r) || '<span class="same">(empty)</span>';
  return `<div class="field"><h4>${title}</h4><div class="sbs"><div class="side"><div class="lbl">Current</div><div class="code">${L}</div></div><div class="side"><div class="lbl">Proposed</div><div class="code">${R}</div></div></div></div>`;
}
function listDiff(title, A, B) {
  if (A.join('|') === B.join('|')) return '';
  const L = A.map(x => B.includes(x) ? `<div>${esc(x)}</div>` : `<div><span class="del">${esc(x)}</span></div>`).join('') || '<span class="same">(none)</span>';
  const R = B.map(x => A.includes(x) ? `<div>${esc(x)}</div>` : `<div><span class="add">${esc(x)}</span></div>`).join('') || '<span class="same">(none)</span>';
  return `<div class="field"><h4>${title}</h4><div class="sbs"><div class="side"><div class="lbl">Current</div><div class="code">${L}</div></div><div class="side"><div class="lbl">Proposed</div><div class="code">${R}</div></div></div></div>`;
}
// one changed field: multi-line text as a line list, single-line text as a token diff ('description' is shown apart)
function fieldDiff(title, a, b) {
  a = a ?? ''; b = b ?? '';
  if (a === b) return '';
  if (a.includes('\n') || b.includes('\n')) return listDiff(esc(title), a ? a.split('\n') : [], b ? b.split('\n') : []);
  return sbs(esc(title), a, b);
}
const fieldDiffs = (before, after) => Object.keys({ ...before, ...after }).filter(k => k !== 'description').map(k => fieldDiff(k, before[k], after[k])).join('');
const fmtVal = v => !v ? '–' : v.error ? `<span class="fail">error</span>` : (v.value == null ? '0' : String(+v.value));

// ---------- rendering ----------
function renderTop() {
  const items = [...DATA.items, ...DATA.aux], tot = items.length || 1;
  const c = { approved: 0, rejected: 0, pending: 0 }; items.forEach(i => c[itemStatus(i)]++);
  $('#bar').innerHTML = `<i class="a" style="width:${100 * c.approved / tot}%"></i><i class="r" style="width:${100 * c.rejected / tot}%"></i>`;
  const cnt = l => { const r = { approved: 0, rejected: 0, pending: 0 }; l.forEach(i => r[itemStatus(i)]++); return r; }, cp = cnt(DATA.items), cm = cnt(DATA.aux);
  const partial = items.filter(i => itemStatus(i) === 'pending' && i.groups.some(g => st(g, i.id) === 'approved')).length;
  $('#progtxt').textContent = `Approved: ${cp.approved} of ${DATA.items.length} ${LB.items}${AK ? `, ${cm.approved} of ${DATA.aux.length} ${LB.aux_shorts}` : ''} · partly approved (other fixes on the same item still pending): ${partial} · blocked by a rejection: ${cp.rejected + cm.rejected} · pending: ${cp.pending + cm.pending - partial}`;
  $('#dbstate').textContent = {
    browser: 'Decisions are kept in this browser. Save a decisions file to share them.',
    nobrowser: 'This browser can’t keep decisions: save a decisions file before closing the page.',
    live: 'Saved for everyone', readonly: 'View only: you can’t change approvals', local: 'Not connected: approvals won’t be saved',
    error: 'Last change could not be saved', connecting: 'Connecting…' }[storeState];
  const ap = DATA.items.filter(p => itemStatus(p) === 'approved'), apOk = ap.filter(p => !p.test.after?.error).length, apFail = ap.length - apOk;
  const apMap = DATA.aux.filter(m => itemStatus(m) === 'approved').length;
  $('#expItems').textContent = `Approved ${LB.shorts} (${apOk})`; $('#expItems').disabled = !apOk;
  $('#expFail').textContent = `Approved, still failing (${apFail})`; $('#expFail').disabled = !apFail;
  $('#expAux').textContent = `${cap(LB.aux_shorts || 'related objects')} (${apMap})`; $('#expAux').disabled = !apMap; $('#expAux').hidden = !AUXX;
  ['#expItems', '#expFail', '#expAux'].forEach(s => { $(s).title = 'Only items with every one of their fixes approved are exported'; });
}
function renderRail() {
  const btn = (key, title, cnt, mini, extra = '') => `<button type="button" data-view="${key}" class="${view === key ? 'cur' : ''}"><span class="t">${title}${extra}</span><span class="c">${cnt}</span>${mini || ''}</button>`;
  const mini = g => { const c = groupCounts(g), n = g.items.length || 1; return `<span class="mini"><i class="a" style="width:${100 * c.approved / n}%"></i><i class="r" style="width:${100 * c.rejected / n}%"></i></span>`; };

  let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch (e) {}
  if (dl) { try { await dl.save({ filename, data: text }); return; } catch (e) { if (e && e.code === 'declined') return; } }
  $('#main').insertAdjacentHTML('afterbegin', `<section class="panel export-out"><h2>${esc(filename)}</h2><p>Saving files isn’t available here. Copy the text below instead.</p><textarea readonly id="exportText">${esc(text)}</textarea><div class="row"><button class="btn primary" type="button" id="copyExport">Copy</button></div></section>`);
}
const today = () => new Date().toISOString().slice(0, 10);
const J = o => JSON.stringify(o, null, 1);

// ---------- events ----------
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v) { view = v.dataset.view; q = ''; filt = 'all'; try { localStorage.setItem('fix-view', view); } catch (err) {} render(); window.scrollTo(0, 0); return; }
  const s = e.target.closest('[data-set]'); if (s && canWrite) { const cur = st(s.dataset.g, s.dataset.id); setStates(s.dataset.g, [s.dataset.id], cur === s.dataset.set ? 'clear' : s.dataset.set); return; }
  const a = e.target.closest('[data-all]'); if (a && canWrite) { const g = GK[view]; const ids = a.dataset.all === 'clear' ? g.items : g.items.filter(id => st(g.key, id) === 'pending'); setStates(g.key, ids, a.dataset.all); return; }
  const af = e.target.closest('[data-allfixes]'); if (af && canWrite) { const it = IT[af.dataset.allfixes] || AX[af.dataset.allfixes]; it.groups.forEach(x => { if (st(x, it.id) !== 'approved') setStates(x, [it.id], 'approved'); }); return; }
  const o = e.target.closest('[data-open]'); if (o) { const id = o.dataset.open; open.has(id) ? open.delete(id) : open.add(id); render(); return; }
  if (e.target.id === 'expandAll') { const g = GK[view]; const all = g.items.every(id => open.has(id)); g.items.forEach(id => all ? open.delete(id) : open.add(id)); render(); return; }
  const stem = `${DATA.fileStem}-${(LB.items || 'items').replace(/\s+/g, '-')}`;
  if (e.target.id === 'expItems') { offer(`${stem}-approved-${today()}.json`, J(approvedPayload(false)), 'application/json'); return; }
  if (e.target.id === 'expFail') { offer(`${stem}-approved-still-failing-${today()}.json`, J(approvedPayload(true)), 'application/json'); return; }
  if (e.target.id === 'expAux' && AUXX) { offer(`${DATA.fileStem}-${AUXX.file}-${today()}${AUXX.kind === 'jsonpatch' ? '.patch' : ''}.json`, J(auxExport()), 'application/json'); return; }
  if (e.target.id === 'expCsv') { offer(`${DATA.fileStem}-fix-review-summary-${today()}.csv`, summaryCsv(), 'text/csv'); return; }
  if (e.target.id === 'copyExport') { const t = $('#exportText'); navigator.clipboard?.writeText(t.value).catch(() => { t.select(); }); return; }
  if (e.target.id === 'saveDec') { if (!me) { toast('Type your name first, so others can see who decided'); $('#reviewer').focus(); return; } blobDownload(`${DATA.prefix || 'review'}-fix-decisions-${me.replace(/[^\w-]+/g, '_')}-${today()}.json`, J(decisionsFile()), 'application/json'); return; }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'loadDec') {
    let total = 0; const bad = [], other = [];
    for (const f of e.target.files) { try { const j = JSON.parse(await f.text()); if (j.dataVersion && j.dataVersion !== DATA.version) other.push(f.name); total += mergeDecisions(j); } catch (err) { bad.push(f.name); } }
    e.target.value = ''; render();
    toast(`Merged ${total} decision${total === 1 ? '' : 's'}` + (bad.length ? `; couldn’t read ${bad.join(', ')}` : '') + (other.length ? `; ${other.join(', ')} came from another version of this page` : ''));
    return;
  }
  if (e.target.id === 'filt') { filt = e.target.value; render(); }
  if (e.target.id === 'readable') { readable = e.target.checked; try { localStorage.setItem('fix-readable', readable ? '1' : '0'); } catch (err) {} render(); }
  if (e.target.id === 'reviewer') { me = e.target.value.trim(); persist(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value.toLowerCase(); const pos = e.target.selectionStart; render(); const el = $('#q'); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.dataset.desc) saveDesc(e.target.dataset.desc, e.target.value);
});

// ---------- boot ----------
if (SA) { restore(); $('#reviewer').value = me; }
render();
(async () => {
  if (SA) return;
  try {
    if (!window.claude || !window.claude.use) { storeState = 'local'; render(); return; }
    const user = await window.claude.use('user');
    if (user) { try { me = await user.id(); } catch (e) {} try { const c = await user.can('data.write'); if (c === false) canWrite = false; } catch (e) {} }
    db = await window.claude.use('db');
    if (!db) { storeState = 'local'; render(); return; }
    storeState = canWrite ? 'live' : 'readonly';
    const typing = () => document.activeElement && (document.activeElement.dataset?.desc || document.activeElement.id === 'q');
    db.collection('approvals').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); }); approvals = n; if (typing()) { renderTop(); renderRail(); } else render(); }, () => { storeState = 'local'; renderTop(); });
    db.collection('descriptions').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); }); descEdits = { ...n, ...Object.fromEntries(Object.entries(descEdits).filter(([k, v]) => v.by === me && (!n[k] || n[k].at < v.at))) }; if (!typing()) render(); });
    render();
  } catch (e) { storeState = 'local'; render(); }
})();
</script>
